<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Trader Utility</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-dark: #111e2e;
            --text-light: #ffffff;
            --text-dark: #333333;
            --accent-blue: #007bff;
            --accent-green: #28a745;
            --accent-red: #dc3545;
            --border-color: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tab-navigation {
            display: flex;
            background: #ebeef2;
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--card-dark);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: #fcfdfe;
            color: #222;
        }

        input:focus {
            outline: 2px solid #cbdbfa;
        }

        .digit-display-card {
            background-color: var(--card-dark);
            color: var(--text-light);
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .digit-main {
            font-size: 84px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            color: #ffffff;
        }

        .timer-sub {
            font-size: 13px;
            color: #8fa0b5;
            margin-top: 8px;
            font-weight: 500;
            background: rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            color: white;
            cursor: pointer;
            text-align: center;
        }

        .btn-blue { background-color: var(--accent-blue); width: 100%; }

        .matrix-container {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .matrix-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--card-dark);
            margin-bottom: 10px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .matrix-step-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }

        .step-id {
            font-size: 10px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
        }

        .step-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--card-dark);
            margin-top: 2px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            background: #f0f2f5;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ccc;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.online { background-color: var(--accent-green); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tab-navigation">
        <button class="tab-btn active" onclick="switchView('martingale', event)">Martingale Grid</button>
        <button class="tab-btn" onclick="switchView('compounding', event)">Compounding Sheet</button>
    </div>

    <div class="digit-display-card">
        <div class="digit-main" id="live-digit">--</div>
        <div class="timer-sub" id="live-timer">Tick Duration: 0.0s</div>
    </div>

    <div class="form-group">
        <label>Deriv API Token Access (Optional for Stream)</label>
        <input type="password" id="api-token" placeholder="Paste your token if available...">
    </div>

    <div class="input-row">
        <div class="form-group" style="flex: 1;">
            <label>Market Index</label>
            <select id="market-symbol" onchange="restartStream()">
                <option value="R_10">Volatility 10 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_100" selected>Volatility 100 Index</option>
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Base Stake ($)</label>
            <input type="number" id="base-stake" value="1.00" step="0.5" oninput="calculateMatrix()">
        </div>
    </div>

    <div class="input-row">
        <div class="form-group" style="flex: 1;">
            -- <label>Payout %</label>
            <input type="number" id="payout-rate" value="95" oninput="calculateMatrix()">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Multiplier</label>
            <input type="number" id="martingale-multiplier" value="2.1" step="0.1" oninput="calculateMatrix()">
        </div>
    </div>

    <button class="btn btn-blue" onclick="connectToDeriv()">Connect Live Stream Data</button>

    <div class="matrix-container">
        <div class="matrix-title" id="matrix-header-title">Position Size Matrix Steps</div>
        <div class="matrix-grid" id="matrix-output-body"></div>
    </div>

    <div class="status-bar">
        <span>Connection Engine: <strong id="connection-state">Offline</strong></span>
        <span class="status-dot" id="status-indicator-dot"></span>
    </div>
</div>

<script>
    let wsConnection = null;
    let currentActiveView = 'martingale';
    let lastTickTimestamp = Date.now();
    let trackingTimerInterval = null;

    function switchView(selectedView, event) {
        currentActiveView = selectedView;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        
        const titleElement = document.getElementById('matrix-header-title');
        if (selectedView === 'compounding') {
            titleElement.innerText = "Compounding Growth Progression Plan";
        } else {
            titleElement.innerText = "Position Size Matrix Steps";
        }
        calculateMatrix();
    }

    function calculateMatrix() {
        const baseStake = parseFloat(document.getElementById('base-stake').value) || 0;
        const multiplier = parseFloat(document.getElementById('martingale-multiplier').value) || 0;
        const payoutRate = parseFloat(document.getElementById('payout-rate').value) / 100 || 0;
        const container = document.getElementById('matrix-output-body');
        
        container.innerHTML = '';

        let currentStake = baseStake;
        for (let stepIndex = 1; stepIndex <= 6; stepIndex++) {
            if (stepIndex > 1) {
                if (currentActiveView === 'martingale') {
                    currentStake = currentStake * multiplier;
                } else {
                    currentStake = currentStake * (1 + payoutRate);
                }
            }

            const box = document.createElement('div');
            box.className = 'matrix-step-box';
            box.innerHTML = `
                <div class="step-id">Step ${stepIndex}</div>
                <div class="step-value">$${currentStake.toFixed(2)}</div>
            `;
            container.appendChild(box);
        }
    }

    function startTickTimer() {
        if (trackingTimerInterval) clearInterval(trackingTimerInterval);
        lastTickTimestamp = Date.now();
        trackingTimerInterval = setInterval(() => {
            const duration = ((Date.now() - lastTickTimestamp) / 1000).toFixed(1);
            document.getElementById('live-timer').innerText = `Tick Duration: ${duration}s`;
        }, 100);
    }
