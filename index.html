<!DOCTYPE html><html><head><meta charset="utf-8"><title>Digits</title><style>body{background:#0e1118;color:#fff;font-family:sans-serif;text-align:center;padding:20px}input,select,button{width:90%;padding:12px;margin:8px 0;background:#222b3c;border:1px solid #334155;color:#fff;border-radius:8px}button{background:#007aff;font-weight:bold;border:none}#digit{font-size:5rem;font-weight:bold;color:#ff9f0a}#clock{font-size:2.5rem;color:#ff3b30}</style></head><body><div style="background:#161c28;max-width:400px;margin:auto;padding:20px;border-radius:12px"><h2>Digit Tracker</h2><input id="appId" placeholder="Deriv App ID"><select id="market"><option value="R_100">Vol 100</option><option value="R_10">Vol 10</option><option value="R_25">Vol 25</option><option value="R_50">Vol 50</option><option value="R_75">Vol 75</option></select><button onclick="connect()">Connect</button><div id="status" style="color:#ff3b30;margin:10px">🔴 Disconnected</div><div id="digit">--</div><div id="clock">0.00s</div></div><script>let ws=null,ping=null,anim=null,lt=0;function connect(){const id=document.getElementById('appId').value.trim(),mkt=document.getElementById('market').value;if(!id)return alert("Need ID");if(ws){clearInterval(ping);cancelAnimationFrame(anim);ws.close()}document.getElementById('status').innerText="⏳ Connecting...";ws=new WebSocket(`wss://://derivws.com{id}`);ws.onopen=()=>{document.getElementById('status').innerText="🍏 Connected";document.getElementById('status').style.color="#4cd964";ws.send(JSON.stringify({ticks:mkt,subscribe:1}));ping=setInterval(()=>ws.send(JSON.stringify({ping:1})),15000)};ws.onmessage=(msg)=>{const res=JSON.parse(msg.data);if(res.msg_type==='tick'&&res.tick){document.getElementById('digit').innerText=res.tick.quote.toString().slice(-1);lt=performance.now();if(anim)cancelAnimationFrame(anim);function run(){document.getElementById('clock').innerText=((performance.now()-lt)/1000).toFixed(2)+"s";anim=requestAnimationFrame(run)}anim=requestAnimationFrame(run)}};ws.onclose=()=>{document.getElementById('status').innerText="🔴 Disconnected";document.getElementById('status').style.color="#ff3b30";clearInterval(ping);cancelAnimationFrame(anim)}}</script></body></html>
