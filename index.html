<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Tracker</title>
    <script>
        window.onerror = function(m, u, l) {
            alert("CRASH LOG IDENTIFIED:\n" + m + "\nLine: " + l);
            return false;
        };
    </script>
    <style>
        body {
            background-color: #111827;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }
        .container {
            background-color: #1f2937;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .4);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            font-size: 1.35rem;
            margin: 0 0 4px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            font-size: .75rem;
            color: #9ca3af;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        input, select {
            width: 100%;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: .9rem;
            box-sizing: border-box;
        }
        .btn-connect {
            width: 100%;
            background-color: #1d4ed8;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-size: .95rem;
        }
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            font-size: .85rem;
            color: #ef4444;
            font-weight: 600;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            background-color: #374151;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            font-size: .75rem;
            cursor: pointer;
            color: #9ca3af;
        }
        .tab.active {
            background-color: #1d4ed8;
            color: #fff;
            font-weight: 600;
        }
        .display-panel {
            background-color: #111827;
            border-radius: 8px;
            padding: 32px 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .panel-label {
            font-size: .75rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 16px;
        }
        .digits-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .panel-footer-text {
            font-size: .85rem;
            color: #9ca3af;
        }
        .stats-grid {
            display: flex;
            justify-content: space-between;
            font-size: .9rem;
            color: #fff;
            font-weight: 600;
            padding: 0 4px;
            margin-bottom: 24px;
        }
        .timer-section {
            text-align: center;
        }
        .timer-label {
            font-size: .7rem;
            color: #9ca3af;
            text-transform: uppercase;
        }
        .timer-digits {
            font-size: 2.25rem;
            font-weight: 700;
            color: #ef4444;
            font-family: monospace;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Market Digit Tracker</h2>
        <div class="subtitle">Match live data with your Deriv Bot</div>
        <div class="form-group">
            <input type="text" id="token-input" value="34pyYqDoydtmYmaa5UxSH">
        </div>
        <div class="form-group">
            <select id="market-selector">
                <option value="R_10">Volatility 10 Index</option>
                <option value="R_25">Volatility 25 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="R_100">Volatility 100 Index</option>
                <option value="1HZ10V">Volatility 10 (1s) Index</option>
                <option value="1HZ25V">Volatility 25 (1s) Index</option>
                <option value="1HZ50V">Volatility 50 (1s) Index</option>
                <option value="1HZ75V">Volatility 75 (1s) Index</option>
                <option value="1HZ100V">Volatility 100 (1s) Index</option>
            </select>
        </div>
        <button class="btn-connect" id="connect-btn">Connect Stream</button>
        <div class="status-container" id="status-area">
            <span class="status-dot" id="status-indicator"></span>
            <span id="status-text">Disconnected</span>
        </div>
        <div class="tab-container">
            <div id="tab-match" class="tab active" onclick="setStrategy('Matches/Differs', 'tab-match')">Matches/Differs</div>
            <div id="tab-even" class="tab" onclick="setStrategy('Even/Odd', 'tab-even')">Even/Odd</div>
            <div id="tab-over" class="tab" onclick="setStrategy('Over/Under', 'tab-over')">Over/Under</div>
        </div>
        <div class="display-panel">
            <div class="panel-label">CURRENT SPOT DIGIT</div>
            <div class="digits-row" id="digits-container">
                <div style="font-size:2.5rem;font-weight:700;color:#f59e0b;margin-top:-10px;">--</div>
            </div>
            <div class="panel-footer-text" id="price-display">Price: --</div>
        </div>
        <div class="stats-grid">
            <div id="strategy-type">Type: Matches/Differs</div>
            <div id="strategy-extra">O/U: --</div>
        </div>
        <div class="timer-section">
            <div class="timer-label">ELAPSED INTERVAL TIME</div>
            <div class="timer-digits" id="timer-display">0.00s</div>
        </div>
    </div>

    <script>
        let ws = null;
        let activeSubscriptionId = null;
        let timerInterval = null;
        let startTime = 0;

        document.getElementById("connect-btn").addEventListener("click", function() {
            const token = document.getElementById("token-input").value.trim();
            const market = document.getElementById("market-selector").value;
            
            if (!token) return alert("Please enter a valid Deriv Token ID!");
            if (ws) ws.close();

            // Dynamic setup binds securely with your token config parameters
            const secureWsUri = "wss://://derivws.com" + token; 
            ws = new WebSocket(secureWsUri);

            document.getElementById("status-text").innerText = "Connecting...";
            document.getElementById("status-indicator").style.backgroundColor = "#f59e0b";
            document.getElementById("status-area").style.color = "#f59e0b";

            ws.onopen = function() {
                ws.send(JSON.stringify({ authorize: token }));
            };

            ws.onmessage = function(e) {
                const response = JSON.parse(e.data);
                
                if (response.msg_type === "authorize" && !response.error) {
                    document.getElementById("status-text").innerText = "Connected";
                    document.getElementById("status-indicator").style.backgroundColor = "#10b981";
                    document.getElementById("status-area").style.color = "#10b981";
                    
                    startTime = Date.now();
                    clearInterval(timerInterval);
                    timerInterval = setInterval(function() {
                        const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                        document.getElementById("timer-display").innerText = elapsed + "s";
                    }, 10);
                    
                    ws.send(JSON.stringify({ ticks: market, subscribe: 1 }));
                }
                
                if (response.msg_type === "tick" && response.tick) {
                    activeSubscriptionId = response.tick.id;
                    const quote = response.tick.quote;
                    const formattedQuote = quote.toFixed(response.tick.pip_size || 2);
                    
                    document.getElementById("price-display").innerText = "Price: " + formattedQuote;
                    document.getElementById("digits-container").innerHTML = '<div style="font-size:2.5rem;font-weight:700;color:#f59e0b;margin-top:-10px;">' + formattedQuote.slice(-1) + '</div>';
                }
                
                if (response.error) {
                    ws.close();
                    clearInterval(timerInterval);
                    document.getElementById("status-text").innerText = "Disconnected";
                    document.getElementById("status-indicator").style.backgroundColor = "#ef4444";
                    document.getElementById("status-area").style.color = "#ef4444";
                    alert("Deriv Server Error: " + response.error.message);
                }
            };

            ws.onclose = function() {
                clearInterval(timerInterval);
