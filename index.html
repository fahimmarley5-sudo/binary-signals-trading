<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Live Digit Tracker</title>
    <style>
        :root {
            --bg-color: #0e1118;
            --card-bg: #161c28;
            --accent-blue: #007aff;
            --accent-green: #4cd964;
            --accent-red: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #8a8d93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 4px 0;
            text-align: center;
            font-size: 1.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .setup-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, button {
            background: #222b3c;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input { flex: 2; }
        select { flex: 1; }

        button {
            width: 100%;
            background: var(--accent-blue);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 20px;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }

        .connection-status {
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .status-disconnected { color: var(--accent-red); }
        .status-connected { color: var(--accent-green); }

        .display-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .digit-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-digit {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 10px 0;
            font-family: monospace;
            color: var(--text-main);
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .analysis-card {
            background: #222b3c;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .analysis-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .analysis-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* Lower section Timer Styling */
        .timer-section {
            border-top: 1px solid #334155;
            padding-top: 20px;
            text-align: center;
        }

        .timer-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .elapsed-clock {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ff9f0a; /* Warning Amber color for tracking speed */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Market Digit Analyzer</h2>
    <div class="subtitle">Match live data seamlessly with your Deriv Bot</div>

    <!-- Configuration Settings Setup -->
    <div class="setup-group">
        <input type="text" id="appIdInput" placeholder="Enter Deriv App ID (e.g. 1011)" value="">
        <select id="marketSelect">
            <option value="1Hz">Vol 10 (1s)</option>
            <option value="R_10">Vol 10</option>
            <option value="R_25">Vol 25</option>
            <option value="R_50">Vol 50</option>
            <option value="R_75">Vol 75</option>
            <option value="R_100" selected>Vol 100</option>
        </select>
    </div>
    <button id="connectBtn" onclick="initiateDerivConnection()">Activate Live Stream</button>

    <div id="statusIndicator" class="connection-status status-disconnected">🔴 System Inactive</div>

    <!-- Active Analytics UI Screen Blocks -->
    <div class="display-box">
        <div class="digit-label">Current Spot Digit</div>
        <div id="digitDisplay" class="live-digit">--</div>
        <div id="priceDisplay" style="color: var(--text-muted); font-size: 0.9rem;">Price: --</div>
    </div>

    <!-- Analysis Logic Displays mapped to standard bot contracts -->
    <div class="analysis-grid">
        <div class="analysis-card">
            <div class="analysis-title">Even / Odd</div>
            <div id="evenOddVal" class="analysis-value">--</div>
        </div>
        <div class="analysis-card">
            <div class="analysis-title">Over / Under (5)</div>
            <div id="overUnderVal" class="analysis-value">--</div>
        </div>
    </div>

    <!-- The Lower Execution Interval Clock requested -->
    <div class="timer-section">
        <div class="timer-label">Exact Elapsed Time Before Digit Changes</div>
        <div id="elapsedClock" class="elapsed-clock">0.00s</div>
    </div>
</div>

<script>
    let socket = null;
    let pingIntervalId = null;
    let timerAnimationId = null;
    let lastTickTimeStamp = 0;

    function initiateDerivConnection() {
        const appId = document.getElementById('appIdInput').value.trim();
        const selectedMarket = document.getElementById('marketSelect').value;
        const statusIndicator = document.getElementById('statusIndicator');
        const connectBtn = document.getElementById('connectBtn');

        if (!appId) {
            alert("Please enter a valid Deriv App ID. You can register/get one instantly from ://deriv.com");
            return;
        }

        // Close existing connections if resetting
        if (socket) {
            clearInterval(pingIntervalId);
            if (timerAnimationId) cancelAnimationFrame(timerAnimationId);
            socket.close();
        }

        statusIndicator.innerText = "⏳ Connecting to Gateway...";
        statusIndicator.className = "connection-status";
        connectBtn.disabled = true;

        // Establish live connection using target application parameter
        socket = new WebSocket(`wss://://derivws.com{appId}`);

        socket.onopen = function() {
            statusIndicator.innerText = "🍏 Connected & Subscribed Live";
            statusIndicator.className = "connection-status status-connected";
            connectBtn.disabled = false;
            connectBtn.innerText = "Update Subscription";

            // 1. Send immediate subscription payload
            socket.send(JSON.stringify({
                "ticks": selectedMarket,
                "subscribe": 1
            }));

            // 2. Start Keep-Alive Protocol (Every 15s) to block automatic timeouts
            pingIntervalId = setInterval(() => {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ "ping": 1 }));
                }
            }, 15000);
        };

        socket.onmessage = function(msg) {
            const responseData = JSON.parse(msg.data);

            if (responseData.msg_type === 'tick' && responseData.tick) {
                const rawPrice = responseData.tick.quote.toString();
                const lastDigit = parseInt(rawPrice.slice(-1));

                // Instantly update numerical structural stats
                document.getElementById('digitDisplay').innerText = lastDigit;
                document.getElementById('priceDisplay').innerText = `Price: ${rawPrice}`;

                // Process bot configurations data blocks
                runStructuralAnalysis(lastDigit);

                // Run high-precision millisecond timing refresh loop
                triggerStopwatchLoop();
            }
        };

        socket.onclose = function() {
            statusIndicator.innerText = "🔴 System Inactive (Disconnected)";
            statusIndicator.className = "connection-status status-disconnected";
            connectBtn.disabled = false;
            connectBtn.innerText = "Activate Live Stream";
            clearInterval(pingIntervalId);
            if (timerAnimationId) cancelAnimationFrame(timerAnimationId);
        };

        socket.onerror = function(err) {
            console.error("WebSocket Connection Flagged Error: ", err);
            statusIndicator.innerText = "🔴 Server Connection Error";
            statusIndicator.className = "connection-status status-disconnected";
        };
    }

    // High precision calculation tracking interval delays down to fractions of milliseconds
    function triggerStopwatchLoop() {
        lastTickTimeStamp = performance.now();
        
        if (timerAnimationId) {
            cancelAnimationFrame(timerAnimationId);
