<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deriv Pro Digit Analyzer</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff4456;
            --primary-green: #00b074;
            --bg-light: #f8f9fa;
            --surface-white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --accent-blue: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container {
            width: 100%; max-width: 480px; background-color: var(--surface-white);
            min-height: 100vh; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; position: relative;
        }

        .app-header { padding: 16px; border-bottom: 1px solid var(--border-light); background: var(--surface-white); position: sticky; top: 0; z-index: 10; }
        .nav-tabs { display: flex; background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: var(--surface-white); color: var(--text-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .app-content { padding: 16px; flex: 1; }
        .panel { display: none; }
        .panel.active { display: block; }

        .strategy-selectors { display: flex; gap: 8px; margin-bottom: 14px; background: #f1f5f9; padding: 4px; border-radius: 8px; }
        .strat-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 6px; text-transform: uppercase; }
        .strat-tab.active { background: var(--text-dark); color: white; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .form-select, .form-input { width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: 10px; font-size: 14px; background-color: var(--bg-light); color: var(--text-dark); outline: none; }

        .digit-stream-panel { background: #1e293b; border-radius: 16px; padding: 24px 16px; margin-bottom: 20px; color: white; text-align: center; position: relative; }
        .live-digit-row { display: flex; justify-content: center; align-items: baseline; gap: 4px; margin-bottom: 4px; }
        .main-digit { font-size: 72px; font-weight: 700; transition: all 0.1s ease; line-height: 1; }
        .main-digit.up { color: var(--primary-green); transform: scale(1.05); }
        .main-digit.down { color: var(--primary-red); transform: scale(1.05); }
        .tick-pure-quote { font-size: 18px; color: #94a3b8; font-family: monospace; font-weight: 500; }

        .timer-container { margin-top: 10px; font-size: 13px; color: #e2e8f0; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 20px; display: inline-flex; margin-bottom: 16px; }
        .timer-dot { width: 8px; height: 8px; background-color: var(--primary-green); border-radius: 50%; animation: blink 0.5s infinite alternate; }
        #micro-timer { font-family: monospace; font-weight: 700; color: #38bdf8; }

        .stream-history { display: flex; justify-content: center; gap: 6px; overflow-x: hidden; padding-top: 14px; border-top: 1px solid #334155; min-height: 44px; }
        .mini-badge { width: 30px; height: 30px; border-radius: 50%; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: #334155; animation: pop 0.2s ease; }
        .mini-badge.even { color: var(--primary-green); border: 2px solid var(--primary-green); }
        .mini-badge.odd { color: var(--primary-red); border: 2px solid var(--primary-red); }

        .execution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .trade-btn { padding: 16px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; color: white; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
        .btn-green { background-color: var(--primary-green); }
        .btn-red { background-color: var(--primary-red); }
        .btn-blue { background-color: var(--accent-blue); }
        .btn-purple { background-color: #7c3aed; }

        .course-card { background: var(--surface-white); border: 1px solid var(--border-light); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .status-bar { padding: 10px 16px; background: #f1f5f9; font-size: 12px; font-weight: 500; display: flex; justify-content: space-between; color: var(--text-muted); border-top: 1px solid var(--border-light); }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; margin-right: 4px; }
        .status-dot.connected { background: var(--primary-green); }

        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes pop { 0% { transform: scale(0.7); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('analyzer')">Analyzer Engine</button>
                <button class="tab-btn" onclick="switchTab('courses')">Strategy Course</button>
                <button class="tab-btn" onclick="switchTab('settings')">Deriv Link API</button>
            </div>
        </header>

        <main class="app-content">
            <div id="panel-analyzer" class="panel active">
                
                <div class="form-group">
                    <label>Volatility Synthetic Market</label>
                    <select id="asset-select" class="form-select" onchange="reconnectStream()">
                        <option value="R_10">Volatility 10 Index</option>
                        <option value="1HZ10V">Volatility 10 (1s) Index</option>
                        <option value="R_25">Volatility 25 Index</option>
                        <option value="1HZ25V">Volatility 25 (1s) Index</option>
                        <option value="R_50">Volatility 50 Index</option>
                        <option value="1HZ50V">Volatility 50 (1s) Index</option>
                        <option value="R_75">Volatility 75 Index</option>
                        <option value="1HZ75V">Volatility 75 (1s) Index</option>
                        <option value="R_100" selected>Volatility 100 Index</option>
                        <option value="1HZ100V">Volatility 100 (1s) Index</option>
                        <option value="R_150">Volatility 150 Index</option>
                        <option value="R_250">Volatility 250 Index</option>
                    </select>
                </div>

                <div class="strategy-selectors">
                    <button id="mode-overunder" class="strat-tab active" onclick="setContractMode('overunder')">Over / Under</button>
                    <button id="mode-matchesdiffers" class="strat-tab" onclick="setContractMode('matchesdiffers')">Matches / Differs</button>
                    <button id="mode-evenodd" class="strat-tab" onclick="setContractMode('evenodd')">Even / Odd</button>
                </div>

                <div class="digit-stream-panel">
                    <div class="live-digit-row">
                        <div id="live-digit" class="main-digit">5</div>
                        <div id="live-quote" class="tick-pure-quote">.4321</div>
                    </div>
                    
                    <div>
                        <div class="timer-container">
                            <div class="timer-dot"></div>
                            <span>Tick Speed: <span id="micro-timer">0.0s</span></span>
                        </div>
                    </div>

                    <div id="stream-history" class="stream-history"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                    <div class="form-group">
                        <label>Stake (USD)</label>
                        <input type="number" id="trade-stake" class="form-input" value="1.00">
                    </div>
                    <div class="form-group">
                        <label>Target Digit Prediction</label>
                        <select id="digit-prediction" class="form-select">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option>
                            <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        </select>
                    </div>
                </div>

                <div id="execution-container" class="execution-grid"></div>
            </div>

            <div id="panel-courses" class="panel">
                <div class="course-card">
                    <h3 style="font-size:15px; margin-bottom:6px;">1. Matches vs Differs Contract Guide</h3>
